<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA Portfolio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GA Portfolio">
<meta name="theme-color" content="#0d1420">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html, body { margin: 0; padding: 0; height: 100%; }
body { background: radial-gradient(circle at top left, #10192b, #080d16 60%); display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #eef1f6; }
.inner { text-align: center; padding: 24px; max-width: 340px; }
.logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 18px; box-shadow: 0 10px 40px rgba(212,175,55,.35); display: block; }
h1 { font-size: 20px; font-weight: 800; margin: 0 0 6px; letter-spacing: .02em; }
.sub { font-size: 14px; color: #90a0b8; margin: 0 0 22px; }
.btn { display: block; padding: 14px 20px; border-radius: 14px; background: linear-gradient(135deg, #d4af37, #f4d371); color: #241b02; font-size: 16px; font-weight: 800; text-decoration: none; }
.howto { margin-top: 26px; font-size: 13px; color: #90a0b8; line-height: 1.6; text-align: left; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px 16px; }
.howto b { color: #eef1f6; }
.share { display: inline-block; transform: translateY(2px); }
</style>
</head>
<body>
<div class="inner">
<img class="logo" src="apple-touch-icon.png" alt="GA">
<h1>GA Portfolio</h1>
<p class="sub">Portfolio Tracker</p>
<a class="btn" href="https://script.google.com/macros/s/AKfycbyrMsdxH2PM0s1I5X2p48ottTNltbayYoKBfTE8npOLUk_hapjFcSMIWJ0hvkbF2XBV/exec">Abrir GA Portfolio</a>
<div class="howto" id="howto">
Para instalarla con este &iacute;cono:<br>
1. Toc&aacute; <b>Compartir</b> <span class="share">&#x2BAD;</span> ac&aacute; en Safari<br>
2. Eleg&iacute; <b>"A&ntilde;adir a pantalla de inicio"</b><br>
3. Confirm&aacute; — y abrila siempre desde el &iacute;cono GA
</div>
</div>
<script>
// Solo redirige cuando corre INSTALADA desde la pantalla de inicio del iPhone.
// navigator.standalone es true SOLO en ese caso (Safari normal, pestañas
// privadas y visores embebidos de otras apps dan false) — así la portada
// nunca te saca de la página mientras la estás instalando.
if (window.navigator.standalone === true) {
  document.getElementById('howto').style.display = 'none';
  window.location.replace(document.querySelector('.btn').href);
}
</script>
</body>
</html>
